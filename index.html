<script>
// EMAIL-ONLY SUPABASE AUTH OVERRIDE
(function(){
  const origLoad = window.onload;
  async function initSupabaseAuth(){
    if(!window.supabaseClient) return;
    // Check session
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    // Listen for auth changes
    window.supabaseClient.auth.onAuthStateChange(async (event, sess) => {
      if(sess?.user){
        localStorage.setItem('myfitpal_supabase_uid', sess.user.id);
        // Try fetch profile
        const { data: prof } = await window.supabaseClient.from('profiles').select('*').eq('id', sess.user.id).single();
        if(prof){
          const appData = {
            user: { name: prof.display_name, email: prof.email, age: prof.age, weight: prof.weight, height: prof.height, goal: prof.goal, activity: prof.activity_level },
            goals: { calories: prof.calorie_goal, protein: prof.protein_goal, carbs: prof.carbs_goal, fat: prof.fat_goal },
            supabase_uid: sess.user.id
          };
          localStorage.setItem('myfitpal_user', JSON.stringify(appData));
        }
        // Sync diary from Supabase to local + setup realtime
        setupRealtime(sess.user.id);
        loadDiaryFromSupabase(sess.user.id);
      } else {
        localStorage.removeItem('myfitpal_supabase_uid');
      }
    });
  }

  async function loadDiaryFromSupabase(uid){
    const today = new Date().toISOString().split('T')[0];
    const { data } = await window.supabaseClient.from('diary').select('*').eq('user_id', uid).eq('entry_date', today).single();
    if(data){
      localStorage.setItem('myfitpal_diary_' + today, JSON.stringify({ meals: data.meals, water: data.water_glasses }));
      window.dispatchEvent(new Event('myfitpal-diary-synced'));
    }
  }
  function setupRealtime(uid){
    window.supabaseClient.channel('diary-'+uid)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'diary', filter: `user_id=eq.${uid}` }, (payload) => {
        const d = payload.new;
        if(d){
          localStorage.setItem('myfitpal_diary_' + d.entry_date, JSON.stringify({ meals: d.meals, water: d.water_glasses }));
          window.dispatchEvent(new Event('myfitpal-diary-synced'));
        }
      }).subscribe();
  }

  window.myfitpalSupabaseSignUp = async (email, password, profile) => {
    const { data, error } = await window.supabaseClient.auth.signUp({ email, password });
    if(error) throw error;
    if(data.user){
      await window.supabaseClient.from('profiles').upsert({
        id: data.user.id, email, display_name: profile.name, age: profile.age, weight: profile.weight,
        height: profile.height, goal: profile.goal, activity_level: profile.activity,
        calorie_goal: profile.calorieGoal, protein_goal: profile.proteinGoal, carbs_goal: profile.carbsGoal, fat_goal: profile.fatGoal
      });
    }
    return data;
  };
  window.myfitpalSupabaseSignIn = async (email, password) => {
    const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if(error) throw error;
    return data;
  };
  window.myfitpalSupabaseSignOut = async () => {
    await window.supabaseClient.auth.signOut();
    localStorage.clear();
    location.reload();
  };

  document.addEventListener('DOMContentLoaded', initSupabaseAuth);
})();
</script>
